# Local dev stack. Per phase-1 §2 we ship a single Postgres for now; api and
# web run on the host via `npm run dev` so hot-reload is instant and the
# NestJS debugger attaches without a shim. A `docker-compose.prod.yml`
# arrives with P1-16 for the VPS.
services:
  db:
    image: postgres:16-alpine
    container_name: currency_exchange_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-currency_exchange}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:

# Production stack for the Contabo VPS (207.180.202.96). This VPS runs a
# Coolify-managed Traefik on the external network `traefik-public`, and
# another app on the same host already declares a service named `api` on
# that network — so we set explicit container names (`cx-*`) to make our
# services unambiguous. Anything reverse-proxying inside our stack must
# use the container name, never the bare service name.
#
# Deploy:
#   cd ~/apps/currency-exchange && git pull
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# Migrations run automatically on api boot (`prisma migrate deploy` in
# the entrypoint). Take a manual pg_dump before deploying anything that
# touches financial tables — this rule bites hardest starting P3.

name: currency-exchange

services:
  db:
    image: postgres:16-alpine
    container_name: cx-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${POSTGRES_DB:?required}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: cx-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@cx-db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET:?required}
      JWT_TTL: ${JWT_TTL:-12h}
      COOKIE_NAME: ${COOKIE_NAME:-cx_session}
      BUSINESS_TZ: ${BUSINESS_TZ:-Africa/Nouakchott}
      API_PORT: 3000
      BOOTSTRAP_OWNER_PHONE: ${BOOTSTRAP_OWNER_PHONE:?required}
      BOOTSTRAP_OWNER_PIN: ${BOOTSTRAP_OWNER_PIN:?required}
      BOOTSTRAP_OWNER_NAME: ${BOOTSTRAP_OWNER_NAME:-Owner}
    networks:
      - internal
      # api joins traefik-public so Traefik can reach it directly for the
      # /api/** router below — the web container never talks to api by
      # hostname (Traefik does the path routing at the edge).
      - traefik-public
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.http.routers.cx-api.rule=Host(`${APP_HOST:?required}`) && PathPrefix(`/api`)
      - traefik.http.routers.cx-api.entrypoints=websecure
      - traefik.http.routers.cx-api.tls=true
      - traefik.http.routers.cx-api.tls.certresolver=letsencrypt
      - traefik.http.services.cx-api.loadbalancer.server.port=3000

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: cx-web
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - traefik-public
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      # Rule length gives cx-api higher automatic priority; we still
      # pin cx-web to priority=1 so any future host-only rule on this
      # domain sits below it.
      - traefik.http.routers.cx-web.rule=Host(`${APP_HOST:?required}`)
      - traefik.http.routers.cx-web.entrypoints=websecure
      - traefik.http.routers.cx-web.tls=true
      - traefik.http.routers.cx-web.tls.certresolver=letsencrypt
      - traefik.http.routers.cx-web.priority=1
      - traefik.http.services.cx-web.loadbalancer.server.port=80

volumes:
  db_data:

networks:
  internal:
    driver: bridge
  # Coolify-managed Traefik lives here. Created once on the VPS.
  # Verify with: `docker network ls | grep traefik-public`
  traefik-public:
    external: true

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: lint · typecheck · test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: currency_exchange_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/currency_exchange_test
      NODE_ENV: test
      BUSINESS_TZ: Africa/Nouakchott
      # Test-only; the real secret lives in the VPS env, never the repo.
      JWT_SECRET: ci-only-secret-not-used-by-any-real-environment-000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --workspaces --include-workspace-root

      - name: Format check
        run: npm run format

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Prisma generate
        run: npm --workspace api exec prisma generate

      - name: Prisma migrate (test DB)
        run: npm --workspace api exec prisma migrate deploy

      - name: Test (unit)
        run: npm run test

      - name: Test (integration)
        run: npm --workspace api run test:integration

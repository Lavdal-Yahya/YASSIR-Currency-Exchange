server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Long-cache the fingerprinted asset files; never cache the shell or
  # the service worker (so a redeploy takes effect on the next reload).
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location = /sw.js {
    add_header Cache-Control "no-cache";
  }

  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache";
  }

  # SPA fallback: any non-file request returns index.html so the router
  # handles the URL client-side. Traefik proxies /api/** straight to
  # the API container — this server never sees those.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
